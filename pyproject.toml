[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2query"
version = "0.1.0"
description = "统一查询指令生成：多源数据库路由、库表召回与 Text-to-Query 生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 只使用社区成熟框架，不重复造轮子：
#   scikit-learn      数据划分与分类器
#   sentence-transformers  语义向量（Qwen3-Embedding）
#   faiss-cpu         向量检索
#   rank-bm25         关键词检索
#   sqlglot           SQL / DDL 解析与校验
#   pydantic(+settings)  数据模型与配置
#   openai + tenacity + diskcache  LLM 调用、重试、缓存
#   typer + rich     命令行与日志
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sqlglot>=25.0",
    "openai>=1.40",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
text2query = "text2query.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text2query"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
